    <script>
      // Set theme before paint to avoid a flash. Saved choice wins; otherwise
      // default to the viewer's local time (dark between 19:00 and 07:00).
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var hour = new Date().getHours();
          var isDark = saved ? saved === 'dark' : (hour < 7 || hour >= 19);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
      .dark ::-webkit-scrollbar-track {
        background: #1c1917;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #57534e;
      }
