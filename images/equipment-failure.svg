<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Equipment failure prediction cover">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1917"/>
      <stop offset="1" stop-color="#0C0A09"/>
    </linearGradient>
    <pattern id="dotsE" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#292524"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bgE)"/>
  <rect width="800" height="500" fill="url(#dotsE)"/>
  <circle cx="120" cy="410" r="220" fill="#C2410C" opacity="0.10"/>

  <!-- gauge -->
  <path d="M250 340 A150 150 0 0 1 550 340" fill="none" stroke="#44403C" stroke-width="16" stroke-linecap="round"/>
  <path d="M506 234 A150 150 0 0 1 550 340" fill="none" stroke="#C2410C" stroke-width="16" stroke-linecap="round"/>

  <!-- ticks -->
  <g stroke="#78716C" stroke-width="4" stroke-linecap="round">
    <line x1="262" y1="300" x2="280" y2="294"/>
    <line x1="300" y1="248" x2="313" y2="262"/>
    <line x1="400" y1="200" x2="400" y2="220"/>
    <line x1="500" y1="248" x2="487" y2="262"/>
    <line x1="538" y1="300" x2="520" y2="294"/>
  </g>

  <!-- needle to danger zone -->
  <line x1="400" y1="340" x2="524" y2="270" stroke="#EA580C" stroke-width="7" stroke-linecap="round"/>
  <circle cx="400" cy="340" r="14" fill="#0C0A09" stroke="#C2410C" stroke-width="5"/>

  <!-- alert triangle -->
  <g transform="translate(400 150)">
    <path d="M0 -26 L26 20 H-26 Z" fill="none" stroke="#EA580C" stroke-width="6" stroke-linejoin="round"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#EA580C" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="14" r="3.5" fill="#EA580C"/>
  </g>
</svg>
