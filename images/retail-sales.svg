<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Retail sales analysis cover">
  <defs>
    <linearGradient id="bgR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1917"/>
      <stop offset="1" stop-color="#0C0A09"/>
    </linearGradient>
    <pattern id="dotsR" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#292524"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bgR)"/>
  <rect width="800" height="500" fill="url(#dotsR)"/>
  <circle cx="670" cy="110" r="200" fill="#C2410C" opacity="0.10"/>

  <!-- axes -->
  <g stroke="#44403C" stroke-width="3" stroke-linecap="round">
    <line x1="230" y1="130" x2="230" y2="380"/>
    <line x1="230" y1="380" x2="580" y2="380"/>
  </g>
  <g stroke="#292524" stroke-width="2">
    <line x1="230" y1="315" x2="580" y2="315"/>
    <line x1="230" y1="250" x2="580" y2="250"/>
    <line x1="230" y1="185" x2="580" y2="185"/>
  </g>

  <!-- bars -->
  <g>
    <rect x="262" y="300" width="40" height="80" rx="4" fill="#57534E"/>
    <rect x="322" y="250" width="40" height="130" rx="4" fill="#78716C"/>
    <rect x="382" y="200" width="40" height="180" rx="4" fill="#C2410C"/>
    <rect x="442" y="270" width="40" height="110" rx="4" fill="#78716C"/>
    <rect x="502" y="230" width="40" height="150" rx="4" fill="#57534E"/>
  </g>

  <!-- trend line -->
  <polyline points="282,290 342,240 402,190 462,255 522,215"
            fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#EA580C">
    <circle cx="282" cy="290" r="6"/><circle cx="342" cy="240" r="6"/>
    <circle cx="402" cy="190" r="6"/><circle cx="462" cy="255" r="6"/><circle cx="522" cy="215" r="6"/>
  </g>

  <!-- KPI chip -->
  <g>
    <rect x="380" y="132" width="118" height="34" rx="6" fill="#171310" stroke="#C2410C" stroke-width="3"/>
    <text x="396" y="156" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#EA580C">12,575</text>
  </g>
</svg>
